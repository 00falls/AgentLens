name: Agent quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.contract.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/prepare_ci_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: trusted-baseline
          path: .tools/ci-baseline.json
          include-hidden-files: true

  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src scripts migrations tests
      - run: uv run pytest tests/test_week6_contracts.py tests/test_week7_contracts.py tests/test_ci_evaluation.py -q --junitxml=reports/local/contracts.xml
      - run: uv run python scripts/check_week6_gate.py
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.28.2
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-checks
          path: |
            reports/local/contracts.xml
            reports/week6-gate-demo.json
            reports/week6-gate-demonstration
            web/dist

  real-evaluation:
    needs: [prepare, deterministic]
    if: needs.prepare.outputs.relevant == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: agentlens
          POSTGRES_PASSWORD: agentlens-local
          POSTGRES_DB: agentlens_eval
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentlens -d agentlens_eval"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: openai/deepseek-flash
      DEEPSEEK_API_BASE: https://api.deepseek.com
      AGENTLENS_DATABASE_URL: postgresql+psycopg://agentlens:agentlens-local@127.0.0.1:5432/agentlens_eval
      LITELLM_MASTER_KEY: sk-agentlens-local-dev
      AGENTLENS_OTLP_INGEST_KEY: agentlens-collector-local-dev
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: trusted-baseline
          path: .tools
      - name: Prepare isolated data and pinned embedding
        run: |
          test -n "$DEEPSEEK_API_KEY"
          uv run python scripts/prepare_ci_database.py
      - name: Download official Linux Collector
        run: |
          mkdir -p .tools/otelcol
          curl --fail --location https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v0.164.0/otelcol_0.164.0_linux_amd64.tar.gz --output .tools/otelcol/archive.tar.gz
          tar -xzf .tools/otelcol/archive.tar.gz -C .tools/otelcol otelcol
      - name: Evaluate ten cases using candidate Prompt
        run: uv run python scripts/run_ci_services.py --report reports/ci/candidate.json --baseline .tools/ci-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-dev10-evidence
          path: |
            reports/ci/candidate*
            reports/local/ci-services

  quality-gate:
    name: Agent quality gate
    needs: [prepare, deterministic, real-evaluation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PREPARE: ${{ needs.prepare.result }}
          SOFTWARE: ${{ needs.deterministic.result }}
          RELEVANT: ${{ needs.prepare.outputs.relevant }}
          QUALITY: ${{ needs.real-evaluation.result }}
        run: |
          test "$PREPARE" = success
          test "$SOFTWARE" = success
          if [ "$RELEVANT" = true ]; then
            echo "Real ten-case evaluation result: $QUALITY"
            echo "Fork contributions need a maintainer-owned branch for secret-backed evaluation."
            test "$QUALITY" = success
          else
            echo "Documentation/results-only change: no additional paid model calls."
          fi
