receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
processors:
  batch:
    timeout: 1s
    send_batch_size: 128
    send_batch_max_size: 512
exporters:
  otlphttp/agentlens:
    endpoint: http://127.0.0.1:8001
    encoding: proto
    compression: none
    headers:
      X-AgentLens-Ingest-Key: ${env:AGENTLENS_OTLP_INGEST_KEY}
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/agentlens]
